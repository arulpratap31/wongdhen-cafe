services:
  - type: web
    name: wongdhen-cafe
    runtime: docker
    plan: starter
    healthCheckPath: /api/v40/local-status
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: wongdhen-cafe-db
          property: connectionString

databases:
  - name: wongdhen-cafe-db
    plan: starter
